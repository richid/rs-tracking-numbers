name: Rust

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true 
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
