[package]
name = "tracking-numbers"
version = "0.1.0"
edition = "2024"

[dependencies]
include_dir = "0.7.4"
lazy_static = "1.5.0"
log = "0.4.29"
pcre2 = "0.2.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "tracking_benchmark"
harness = false
